name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: 0.9.145

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Build and archive tests
        run: cargo nextest archive --workspace --cargo-profile dist --locked --archive-file nextest-archive.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: nextest-${{ matrix.os }}
          path: nextest-archive.tar.zst
          compression-level: 0
          if-no-files-found: error

  test:
    name: Test / ${{ matrix.os }} / R ${{ matrix.r }} / ${{ matrix.shard }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: [release, oldrel]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: nextest-${{ matrix.os }}

      - name: Run archived tests
        # Unit tests run once per OS (partitioned across the release shards).
        # E2E tests run against both R versions using the same compiled binaries.
        run: >-
          cargo-nextest nextest run --profile ci
          --archive-file nextest-archive.tar.zst --workspace-remap . --extract-to .
          -E "${{ matrix.r == 'release' && 'all()' || 'binary(=e2e)' }}"
          --partition slice:${{ matrix.shard }}/3

      - name: Summarize test results
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Tests / ${{ matrix.os }} / R ${{ matrix.r }} / ${{ matrix.shard }}
          annotate_only: true
          skip_annotations: true
          job_summary: true
          detailed_summary: true
          include_time_in_summary: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.r }}-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml

  windows-diagnostic:
    name: Diagnose Windows Rscript
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: nextest-windows-latest

      - name: Compare direct and wrapped Rscript
        env:
          RPX_DIAGNOSTIC_REPORT: ${{ github.workspace }}/diagnostic-results.json
        run: >-
          cargo-nextest nextest run --profile ci
          --archive-file nextest-archive.tar.zst --workspace-remap . --extract-to .
          --run-ignored only -E 'test(windows_diagnostic::compare_direct_and_wrapped_rscript)'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-rscript-diagnostics
          path: |
            diagnostic-results.json
            target/nextest/ci/junit.xml
