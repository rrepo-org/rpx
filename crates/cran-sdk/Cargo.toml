[package]
name = "cran-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Async CRAN repository protocol SDK with caller-supplied HTTP clients"
repository = "https://github.com/rrepo-org/rpx"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
reqwest-middleware = "0.5"
r-description = { package = "r-description-parser", version = "=0.2.0" }
r-packages = { package = "r-packages-parser", version = "=0.2.0" }
r-metadata = "=0.2.0"
flate2 = "1.1.5"
tar = "0.4.44"
thiserror = "2.0.17"
tracing = "0.1.41"

[dev-dependencies]
async-trait = "0.1"
http = "1"
mockito = "1.7.0"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }
