name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish source package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check release version
        shell: bash
        run: |
          version=$(awk '$1 == "Version:" {print $2}' DESCRIPTION)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build source package
        run: R CMD build .
      - name: Upload source package to rrepo
        shell: bash
        env:
          RREPO_REPOSITORY_URL: ${{ secrets.RREPO_REPOSITORY_URL }}
          RREPO_API_KEY: ${{ secrets.RREPO_API_KEY }}
        run: |
          : "${RREPO_REPOSITORY_URL:?Set the RREPO_REPOSITORY_URL secret}"
          : "${RREPO_API_KEY:?Set the RREPO_API_KEY secret}"
          package=$(awk '$1 == "Package:" {print $2}' DESCRIPTION)
          version=$(awk '$1 == "Version:" {print $2}' DESCRIPTION)
          tarball="${package}_${version}.tar.gz"
          test -f "$tarball"
          curl --fail --show-error \
            --request POST \
            --header "Authorization: Bearer ${RREPO_API_KEY}" \
            --form "file=@${tarball}" \
            "${RREPO_REPOSITORY_URL%/}/upload"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          package=$(awk '$1 == "Package:" {print $2}' DESCRIPTION)
          version=$(awk '$1 == "Version:" {print $2}' DESCRIPTION)
          gh release create "$GITHUB_REF_NAME" "${package}_${version}.tar.gz" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
