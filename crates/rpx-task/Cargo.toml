[package]
name = "rpx-task"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Typed async task graphs for rpx"

[dependencies]
rpx-scheduler = { path = "../rpx-scheduler" }
tokio = { version = "1.51.1", features = ["rt", "sync"] }
thiserror = "2.0.17"

[dev-dependencies]
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros", "sync"] }
