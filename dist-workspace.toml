[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0-github-placeholder"
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = ["simple", "github"]
# A URL to download artifacts from
simple-download-url = "https://rrepo.org/rpx/{tag}"
# Host jobs to run in CI
host-jobs = ["./upload-r2"]
# Whether to install an updater program
install-updater = false

# Sign Windows executables with Azure Artifact Signing
[dist.azure-windows-sign]
endpoint = "https://weu.codesigning.azure.net/"
account-name = "rpx-signing-account"
certificate-profile-name = "rpx-public-trust"
